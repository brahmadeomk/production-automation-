# AVRDUDE configuration fragment for the programming station.
#
# avrdude's built-in `linuxspi` programmer needs to know which GPIO drives the
# target's RESET line.  This file redefines it with GPIO25, matching SRS
# section 5.  It is appended to the built-in configuration, not replacing it:
#
#     avrdude -C +/etc/progstation/avrdude-linuxspi.conf ...
#
# which is exactly what `avrdude.config_file` in station.yaml does.

programmer
    id                     = "linuxspi";
    desc                   = "Programming station ISP via Pi SPI0, RESET on GPIO25";
    type                   = "linuxspi";
    prog_modes             = PM_ISP;
    connection_type        = spi;
    reset                  = 25;
;
