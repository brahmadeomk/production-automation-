[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "progstation"
version = "1.0.0"
description = "Raspberry Pi based sensor programming and manufacturing traceability station"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
dependencies = [
    "PyYAML>=5.4",
]

[project.optional-dependencies]
# The touchscreen application.  On Raspberry Pi OS prefer the distribution
# package (`apt install python3-pyqt5`) over the wheel.
gui = ["PyQt5>=5.15"]
# XLSX export (SRS section 14).
excel = ["openpyxl>=3.0"]
# GPIO drivers; lgpio is the one Raspberry Pi OS Trixie ships.
gpio = ["lgpio>=0.2"]
dev = ["pytest>=7.0", "openpyxl>=3.0"]

[project.scripts]
progstation = "progstation.cli:main"

[tool.setuptools.packages.find]
include = ["progstation*"]

[tool.setuptools.package-data]
progstation = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
